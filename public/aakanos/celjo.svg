<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ffeedd"/></linearGradient>
    <linearGradient id="corps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ece0"/><stop offset="1" stop-color="#a9dccb"/></linearGradient>
    <linearGradient id="scoot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a52"/><stop offset="1" stop-color="#c22a24"/></linearGradient>
    <pattern id="rayure" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="10" height="10" fill="#bfe3f7"/><rect width="4" height="10" fill="#f6e6a8"/><rect x="7" width="2" height="10" fill="#6aa8e0"/></pattern>
  </defs>
  <rect width="400" height="400" fill="url(#ciel)"/>
  <circle cx="80" cy="80" r="40" fill="#fff3c4"/>
  <rect y="300" width="400" height="100" fill="#5a5f66"/>
  <path d="M0 348 H400" stroke="#f4f4f4" stroke-width="5" stroke-dasharray="34 24"/>
  <!-- traits de vitesse -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".8"><path d="M20 210 H90"/><path d="M10 240 H70"/><path d="M30 270 H100"/></g>
  <!-- scooter -->
  <circle cx="125" cy="300" r="30" fill="#1f2328"/><circle cx="125" cy="300" r="13" fill="#b9c0c8"/>
  <circle cx="300" cy="300" r="30" fill="#1f2328"/><circle cx="300" cy="300" r="13" fill="#b9c0c8"/>
  <path d="M100 290 C100 250 140 238 190 240 L250 240 C268 240 276 256 286 270 L320 290 C330 296 322 306 312 304 L120 304 C108 304 100 300 100 290 Z" fill="url(#scoot)"/>
  <path d="M286 270 L300 196 L318 196" stroke="#2b2f35" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M308 196 L336 188" stroke="#2b2f35" stroke-width="9" stroke-linecap="round"/>
  <circle cx="318" cy="222" r="10" fill="#fff6b0" stroke="#2b2f35" stroke-width="3"/>
  <rect x="150" y="226" width="90" height="16" rx="8" fill="#3a2f2a"/>
  <!-- lapin -->
  <g>
    <!-- oreilles longues qui flottent au vent -->
    <path d="M196 92 C150 70 104 84 86 112 C116 112 150 112 186 120 Z" fill="#fbf3dc" stroke="#e6d9b8" stroke-width="3"/>
    <path d="M220 90 C232 50 262 30 296 36 C282 60 262 86 238 112 Z" fill="#fbf3dc" stroke="#e6d9b8" stroke-width="3"/>
    <!-- corps (grenouillère menthe) -->
    <path d="M168 168 C168 150 248 150 252 168 L262 236 C262 246 168 246 162 236 Z" fill="url(#corps)" stroke="#8fcab6" stroke-width="3"/>
    <path d="M206 186 c6-10 18-10 18 2 c12-2 16 10 6 16 c8 8 0 18-10 12 c-2 12-16 12-18 0 c-10 6-18-4-10-12 c-10-6-6-18 6-16 c0-4 4-6 8-2z" fill="url(#rayure)" stroke="#5a9ad6" stroke-width="2.5"/>
    <!-- bras vers le guidon -->
    <path d="M246 180 C270 186 290 192 304 196" stroke="#a9dccb" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="306" cy="196" r="11" fill="#fbf3dc"/>
    <!-- jambes et pattes -->
    <path d="M190 236 C190 252 196 262 210 264" stroke="#a9dccb" stroke-width="20" fill="none" stroke-linecap="round"/>
    <ellipse cx="220" cy="266" rx="16" ry="10" fill="#fbf3dc"/>
    <!-- tête -->
    <ellipse cx="210" cy="128" rx="44" ry="40" fill="#fbf3dc" stroke="#e6d9b8" stroke-width="3"/>
    <circle cx="194" cy="122" r="6" fill="#6b4a32"/><circle cx="226" cy="122" r="6" fill="#6b4a32"/>
    <circle cx="196" cy="120" r="2" fill="#fff"/><circle cx="228" cy="120" r="2" fill="#fff"/>
    <path d="M204 136 q6 -6 12 0 q-6 8 -12 0z" fill="#8a5a3c"/>
    <path d="M196 148 q14 12 28 0" stroke="#8a5a3c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- casque -->
    <path d="M170 116 C172 84 248 82 250 116 Z" fill="#3f86c6" opacity=".9"/>
  </g>
</svg>
